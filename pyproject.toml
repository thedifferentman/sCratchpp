[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrate"
version = "0.2.0"
description = "Build, run, debug and manage packages for sCr++"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
scrate = "scrate:main"

[tool.setuptools]
package-dir = {"" = "tools"}
py-modules = ["scrate", "scrate_build", "scrate_run", "build_resources"]
